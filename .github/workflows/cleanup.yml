# Deletes old workflow runs, to keep the Actions list and its storage small.
#
# By default a run is deleted when it is older than `days`, did not succeed, and is not a
# release: runs of `v*` tags, and runs started by a published release, are always kept. Runs
# still queued or in progress are never touched. Run it by hand from the Actions tab, or let
# the weekly schedule clean up with the defaults.
name: Cleanup workflow runs

on:
  workflow_dispatch:
    inputs:
      days:
        description: Delete runs older than this many days
        type: number
        default: 30
      include_successful:
        description: Also delete successful runs (release runs are still kept)
        type: boolean
        default: false
      dry_run:
        description: Only list the runs that would be deleted
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete old runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || 30 }}
          INCLUDE_SUCCESSFUL: ${{ inputs.include_successful || false }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          SELF_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$DAYS" =~ ^[0-9]+$ ]]; then
            echo "::error::days must be a whole number, got '$DAYS'"
            exit 1
          fi
          cutoff=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting runs created before $cutoff (successful too: $INCLUDE_SUCCESSFUL, dry run: $DRY_RUN)"

          # Every completed run created before the cutoff.
          gh api --paginate "repos/$REPO/actions/runs?status=completed&created=%3C$cutoff&per_page=100" \
            --jq '.workflow_runs[] | [.id, .conclusion, .event, .head_branch, .name, .created_at] | @tsv' \
            > runs.tsv

          # A run whose ref is a `v*` tag of the repository is a release run, and is kept.
          gh api --paginate "repos/$REPO/tags?per_page=100" --jq '.[].name' > tags.txt

          deleted=0
          kept=0
          while IFS=$'\t' read -r id conclusion event branch name created; do
            [ "$id" = "$SELF_RUN" ] && continue
            if [ "$event" = "release" ] || { [[ "$branch" == v* ]] && grep -Fxq "$branch" tags.txt; }; then
              kept=$((kept + 1))
              continue
            fi
            if [ "$conclusion" = "success" ] && [ "$INCLUDE_SUCCESSFUL" != "true" ]; then
              kept=$((kept + 1))
              continue
            fi
            echo "$created  $conclusion  $name  ($branch, $event)  #$id"
            if [ "$DRY_RUN" != "true" ]; then
              gh api -X DELETE "repos/$REPO/actions/runs/$id" --silent || echo "::warning::could not delete run $id"
            fi
            deleted=$((deleted + 1))
          done < runs.tsv

          verb=$([ "$DRY_RUN" = "true" ] && echo "Would delete" || echo "Deleted")
          echo "$verb $deleted run(s); kept $kept older run(s)."
          echo "$verb $deleted workflow run(s) older than $DAYS days; kept $kept." >> "$GITHUB_STEP_SUMMARY"
