name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-26.04
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Command line smoke test
        shell: bash
        run: |
          cargo run --locked -- --version
          cargo run --locked -- --list-languages
          cargo run --locked -- --cli samples/left/same.txt samples/right/same.txt
          set +e
          cargo run --locked -- --cli -r samples/left samples/right > /dev/null
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit code 1 for differing folders, got $code"; exit 1; }

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          root="dist/macos-root"
          mkdir -p "$root"
          lipo -create \
            target/aarch64-apple-darwin/release/oxidemerge \
            target/x86_64-apple-darwin/release/oxidemerge \
            -output "$root/oxidemerge"
          codesign --force --sign - "$root/oxidemerge"
          cp README.md LICENSE "$root/"
          hdiutil create \
            -volname "OxideMerge ${version}" \
            -srcfolder "$root" \
            -ov \
            -format UDZO \
            "dist/oxidemerge-${version}-macos.dmg"
          rm -rf "$root"

      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: oxidemerge-macos
          path: dist/*.dmg
          if-no-files-found: error
