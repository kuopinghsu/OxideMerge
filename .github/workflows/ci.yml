# Pull requests run the full test suite and CLI/window checks on Windows x64,
# Linux x64 and macOS Apple silicon, plus dependency checks. Every push to main
# or a release tag also tests native Windows/Linux Arm64, builds all nine release
# files and checks AppImages on Ubuntu 22.04/AlmaLinux 8. Manual runs can opt into
# packaging; only release-tag pushes publish a GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: Build and validate all release packages (including Windows/Linux Arm64)
        type: boolean
        default: false
      stress_cases:
        description: Random cases per diff, merge and patch test (blank to skip the stress run)
        required: false
        default: ""
      benchmarks:
        description: Run benchmarks
        type: boolean
        default: false

permissions:
  contents: read

# Runs started by hand (stress tests, benchmarks) neither cancel nor are cancelled by pushes.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: "1"

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            (github.event_name == 'push' || inputs.packages)
            && '[{"arch":"x64","runner":"windows-latest","target":"x86_64-pc-windows-msvc"},{"arch":"arm64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]'
            || '[{"arch":"x64","runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]'
          ) }}
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      MESA_VERSION: "26.2.5"
      # Pinned with the archive so a changed build is downloaded again, not reused.
      MESA_SHA256: ${{ matrix.arch == 'arm64' && 'e7df75398d50e07a68bbffa5cff2ece4c85e5f8ef8bda497f560dd04fe60cbbd' || 'd1b713ca2a7fba47a50c058099f13c435ddb76a16a422c334e4d787f9755a31d' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ring compiles its assembly with clang for Windows on Arm.
      - name: Install LLVM
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            $llvm = 'C:\Program Files\LLVM\bin'
            if (-not (Test-Path "$llvm\clang.exe")) {
              choco install llvm --no-progress -y
            }
            $llvm >> $env:GITHUB_PATH
          }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The code is the same on both architectures, so lint once.
      - name: Clippy
        if: matrix.arch == 'x64'
        run: cargo clippy --locked --all-targets -- -D warnings

      # Built apart from running them: building alone takes 20 minutes on a cold cache
      # (OpenSSL for libssh2 is compiled from source).
      - name: Build tests
        run: cargo test --release --locked --target ${{ matrix.target }} --no-run

      # A test that hangs fails here instead of holding the runner until the job's timeout.
      - name: Test
        timeout-minutes: 20
        run: cargo test --release --locked --target ${{ matrix.target }}

      # An explicit target, so the package is for this architecture even if the
      # toolchain on the runner is not.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Command line smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin=target/$TARGET/release/oxidemerge
          "$bin" --version
          "$bin" --list-languages
          "$bin" --cli samples/left/same.txt samples/right/same.txt
          code=0
          "$bin" --cli -r samples/left samples/right >/dev/null || code=$?
          test "$code" -eq 1 || { echo "::error::Expected exit code 1 for differing folders, got $code"; exit 1; }

      # Hosted Windows runners have no OpenGL beyond 1.1, so Mesa's llvmpipe
      # renders in software. Its opengl32.dll goes next to a copy of the
      # program, never into the package. The release CDN often answers 504
      # for a short while, so a verified archive is reused and a miss retries.
      - name: Cache Mesa llvmpipe
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/mesa-llvmpipe
          key: mesa-llvmpipe-${{ matrix.arch }}-${{ env.MESA_VERSION }}-${{ env.MESA_SHA256 }}

      - name: Window smoke test
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
          GUI_SMOKE_STRICT: "1"
        run: |
          set -euo pipefail
          archive=mesa-llvmpipe-$ARCH-$MESA_VERSION.7z
          cached=target/mesa-llvmpipe/$archive
          url="https://github.com/mmozeiko/build-mesa/releases/download/$MESA_VERSION/$archive"
          mkdir -p target/mesa-llvmpipe
          if [ -f "$cached" ] && echo "$MESA_SHA256  $cached" | sha256sum -c -; then
            echo "Using cached $archive"
          else
            rm -f "$cached"
            ok=0
            for attempt in 1 2 3 4 5; do
              echo "Downloading $archive (attempt $attempt)"
              # The release CDN often answers 504 over HTTP/2; force HTTP/1.1 and
              # wait it out. The file is about 16 MB, so a hung transfer is cut off.
              if curl -fL --http1.1 --retry 2 --retry-all-errors --retry-delay 5 \
                   --connect-timeout 20 --max-time 90 \
                   -o "$RUNNER_TEMP/$archive" "$url" \
                 && echo "$MESA_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -; then
                mv "$RUNNER_TEMP/$archive" "$cached"
                ok=1
                break
              fi
              rm -f "$RUNNER_TEMP/$archive"
              echo "::warning::Mesa download attempt $attempt failed"
              sleep $((attempt * 15))
            done
            [ "$ok" = 1 ] || { echo "::error::Could not download $url"; exit 1; }
          fi
          dir=target/gui-smoke-bin
          mkdir -p "$dir"
          if command -v 7z >/dev/null; then
            7z e -y -o"$dir" "$cached" opengl32.dll >/dev/null
          else
            "$SYSTEMROOT/System32/tar.exe" -xf "$(cygpath -w "$cached")" -C "$dir" opengl32.dll
          fi
          cp "target/$TARGET/release/oxidemerge.exe" "$dir/"
          bash scripts/gui-smoke.sh "$dir/oxidemerge.exe" target/gui-smoke

      - name: Keep test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-output-windows-${{ matrix.arch }}
          path: |
            target/gui-tests
            target/gui-smoke
          if-no-files-found: ignore

      - name: Package
        if: github.event_name == 'push' || inputs.packages
        id: package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              Write-Error "Tag $env:GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            }
            $label = $version
          } else {
            $label = "$version-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          $name = "oxidemerge-$label-windows-$env:ARCH"
          $exe = "target/$env:TARGET/release/oxidemerge.exe"

          # The machine field of the PE header: 0x8664 for x64, 0xAA64 for arm64.
          $bytes = [IO.File]::ReadAllBytes($exe)
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4)
          $expected = @{ x64 = 0x8664; arm64 = 0xAA64 }[$env:ARCH]
          if ($machine -ne $expected) {
            Write-Error ("oxidemerge.exe is for machine 0x{0:X4}, not {1}" -f $machine, $env:ARCH)
            exit 1
          }

          # The .zip holds oxidemerge.exe and nothing else.
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $exe -DestinationPath "dist/$name.zip"
          Expand-Archive "dist/$name.zip" -DestinationPath check
          $files = @(Get-ChildItem -Recurse -Force check | ForEach-Object { $_.Name })
          if ($files.Count -ne 1 -or $files[0] -ne 'oxidemerge.exe') {
            Write-Error "$name.zip should hold only oxidemerge.exe, not: $($files -join ', ')"
            exit 1
          }
          & check/oxidemerge.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Get-ChildItem dist | Format-Table Name, Length
          "name=$name" >> $env:GITHUB_OUTPUT

      - if: github.event_name == 'push' || inputs.packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    # The oldest supported runners, so the binary runs on older glibc too.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            (github.event_name == 'push' || inputs.packages)
            && '[{"arch":"x64","runner":"ubuntu-22.04"},{"arch":"arm64","runner":"ubuntu-22.04-arm"}]'
            || '[{"arch":"x64","runner":"ubuntu-22.04"}]'
          ) }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libgl1-mesa-dev \
            xvfb libgl1-mesa-dri libegl-mesa0 libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        if: matrix.arch == 'x64'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build tests
        run: cargo test --release --locked --no-run

      - name: Test
        timeout-minutes: 20
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Command line smoke test
        run: |
          set -euo pipefail
          bin=target/release/oxidemerge
          "$bin" --version
          "$bin" --list-languages
          "$bin" --cli samples/left/same.txt samples/right/same.txt
          code=0
          "$bin" --cli -r samples/left samples/right >/dev/null || code=$?
          test "$code" -eq 1 || { echo "::error::Expected exit code 1 for differing folders, got $code"; exit 1; }

      # Mesa's software renderer under a virtual display.
      - name: Window smoke test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GUI_SMOKE_STRICT: "1"
        run: bash scripts/gui-smoke.sh target/release/oxidemerge target/gui-smoke

      - name: Keep test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-output-linux-${{ matrix.arch }}
          path: |
            target/gui-tests
            target/gui-smoke
          if-no-files-found: ignore

      - name: Package
        if: github.event_name == 'push' || inputs.packages
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            # The release notes come from CHANGELOG.md; fail before packaging, not after.
            scripts/release-notes.sh "$version" >/dev/null || {
              echo "::error::CHANGELOG.md has no section for $version"
              exit 1
            }
            grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md || {
              echo "::error::CHANGELOG.md gives no release date for $version"
              exit 1
            }
            label=$version
          else
            label="$version-${GITHUB_SHA::7}"
          fi
          name="oxidemerge-$label-linux-$ARCH"
          strip target/release/oxidemerge
          want=$([ "$ARCH" = arm64 ] && echo aarch64 || echo x86-64)
          file target/release/oxidemerge | tee /dev/stderr | grep -q "$want" || {
            echo "::error::oxidemerge is not a $want program"
            exit 1
          }
          mkdir -p dist "staging/$name"

          install -m 755 target/release/oxidemerge "staging/$name/"
          install -m 644 README.md LICENSE assets/oxidemerge.desktop assets/oxidemerge.png "staging/$name/"
          tar -C staging -czf "dist/$name.tar.gz" "$name"

          ls -l dist
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # What the archive holds, and that the program in it runs without touching the
      # user's settings.
      - name: Check packages
        if: github.event_name == 'push' || inputs.packages
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          listing=$(tar -tzf "dist/$NAME.tar.gz")
          for f in oxidemerge README.md LICENSE oxidemerge.desktop oxidemerge.png; do
            grep -qx "$NAME/$f" <<<"$listing" || { echo "::error::$NAME.tar.gz lacks $f"; exit 1; }
          done
          mkdir -p check
          tar -C check -xzf "dist/$NAME.tar.gz"
          bin="check/$NAME/oxidemerge"
          # Options given on the command line apply to that run only.
          mkdir -p ~/.config/OxideMerge
          echo '{"language":"de"}' > ~/.config/OxideMerge/config.json
          "$bin" --version
          "$bin" --cli --ignore-case samples/left/same.txt samples/right/same.txt
          jq -e '.language == "de" and (.diff.ignore_case // false) == false' \
            ~/.config/OxideMerge/config.json >/dev/null ||
            { echo "::error::Running the program changed the settings"; exit 1; }

      - if: github.event_name == 'push' || inputs.packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  appimage:
    if: github.event_name == 'push' || inputs.packages
    name: Linux AppImage ${{ matrix.arch }}
    # AlmaLinux 8 has glibc 2.28, so the AppImage runs on RHEL 8, Ubuntu 20.04,
    # Debian 10, and newer.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: almalinux:8
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      # OxideMerge links only to glibc and opens its display and keyboard
      # libraries at runtime. They are installed without their -devel
      # packages, so the build does not record AlmaLinux's library folders and
      # OxideMerge looks them up by name, as AppRun arranges.
      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          # Use AlmaLinux's HTTPS origin rather than a slow/out-of-sync mirror.
          # Preserve the distribution's package signature verification settings.
          dnf_options=(
            --setopt=timeout=20 --setopt=retries=2 --setopt=minrate=100000
            --setopt=baseos.mirrorlist=
            '--setopt=baseos.baseurl=https://repo.almalinux.org/almalinux/$releasever/BaseOS/$basearch/os/'
            --setopt=appstream.mirrorlist=
            '--setopt=appstream.baseurl=https://repo.almalinux.org/almalinux/$releasever/AppStream/$basearch/os/'
            --setopt=extras.mirrorlist=
            '--setopt=extras.baseurl=https://repo.almalinux.org/almalinux/$releasever/extras/$basearch/os/'
          )
          for attempt in 1 2 3; do
            if dnf "${dnf_options[@]}" install -y --setopt=install_weak_deps=False \
              gcc gcc-c++ make perl perl-IPC-Cmd pkgconf-pkg-config git curl tar gzip jq file desktop-file-utils \
              libX11 libX11-xcb libxcb libXcursor libXi libxkbcommon libxkbcommon-x11 \
              libwayland-client libwayland-cursor libwayland-egl; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::AlmaLinux build dependency installation failed after 3 attempts"
              exit 1
            fi
            dnf clean metadata
            sleep $((attempt * 5))
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The mounted checkout belongs to the runner, and checkout trusts it only
      # under its temporary HOME. build.rs needs Git under the container's HOME.
      - name: Trust the mounted checkout for the build
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            label=$version
          else
            label="$version-${GITHUB_SHA::7}"
          fi
          VERSION=$label bash scripts/package-appimage.sh
          ls -l dist
          echo "artifact=oxidemerge-$label-linux-${{ matrix.arch }}-appimage" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/*
          if-no-files-found: error

  appimage-test:
    name: AppImage ${{ matrix.arch }} on ${{ matrix.system }}
    needs: appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        system: [Ubuntu 22.04, RHEL 8 (AlmaLinux 8)]
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - system: Ubuntu 22.04
            image: ubuntu:22.04
          - system: RHEL 8 (AlmaLinux 8)
            image: almalinux:8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: oxidemerge-*-linux-${{ matrix.arch }}-appimage
          merge-multiple: true

      - name: Unpack
        run: |
          chmod +x oxidemerge-*.AppImage
          ./oxidemerge-*.AppImage --appimage-extract >/dev/null
          ls squashfs-root/usr/lib/oxidemerge

      # The bare image has no display libraries, so AppRun would use every
      # bundled one: together with glibc they must cover everything
      # OxideMerge and each of them needs.
      - name: Check bundled libraries
        working-directory: squashfs-root
        run: |
          bundled=$(printf '%s:' "$PWD"/usr/lib/oxidemerge/*)
          failed=0
          for file in usr/bin/oxidemerge usr/lib/oxidemerge/*/*; do
            if LD_LIBRARY_PATH=${bundled%:} ldd "$file" 2>&1 | grep 'not found'; then
              echo "::error::$file needs the libraries above"
              failed=1
            fi
          done
          exit $failed

      - name: Command line smoke test
        run: |
          set -euo pipefail
          app=squashfs-root/AppRun
          version_output=$("$app" --version)
          echo "$version_output"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            expected="oxidemerge ${GITHUB_REF_NAME#v} (build "
            date_pattern='^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\)$'
            if [[ "$version_output" != "$expected"* || ! "${version_output#"$expected"}" =~ $date_pattern ]]; then
              echo "::error::Expected the tagged AppImage to report its release version and build date"
              exit 1
            fi
          fi
          mkdir -p left right
          printf 'one\ntwo\n' > left/a.txt
          printf 'one\ntwo\n' > right/a.txt
          "$app" --cli left/a.txt right/a.txt
          printf 'one\nthree\n' > right/a.txt
          code=0
          "$app" --cli left/a.txt right/a.txt >/dev/null || code=$?
          test "$code" -eq 1 || { echo "::error::Expected exit code 1 for differing files, got $code"; exit 1; }

      - name: Install a virtual display
        timeout-minutes: 10
        run: |
          if command -v apt-get >/dev/null; then
            # archive.ubuntu.com can stall for minutes from GitHub's runners; its Azure mirror
            # does not. Arm64 packages come from ports.ubuntu.com, left as it is.
            sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list
            apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20)
            for attempt in 1 2 3; do
              if apt-get "${apt_options[@]}" update &&
                DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y \
                  --no-install-recommends \
                  xvfb libgl1 libglx-mesa0 libegl1 libegl-mesa0 libgl1-mesa-dri; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Ubuntu display dependency installation failed after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          else
            dnf_options=(
              --setopt=timeout=20 --setopt=retries=2 --setopt=minrate=100000
              --setopt=baseos.mirrorlist=
              '--setopt=baseos.baseurl=https://repo.almalinux.org/almalinux/$releasever/BaseOS/$basearch/os/'
              --setopt=appstream.mirrorlist=
              '--setopt=appstream.baseurl=https://repo.almalinux.org/almalinux/$releasever/AppStream/$basearch/os/'
              --setopt=extras.mirrorlist=
              '--setopt=extras.baseurl=https://repo.almalinux.org/almalinux/$releasever/extras/$basearch/os/'
            )
            for attempt in 1 2 3; do
              if dnf "${dnf_options[@]}" install -y --setopt=install_weak_deps=False \
                xorg-x11-server-Xvfb mesa-libGL mesa-libEGL mesa-dri-drivers; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::AlmaLinux display dependency installation failed after 3 attempts"
                exit 1
              fi
              dnf clean metadata
              sleep $((attempt * 5))
            done
          fi

      # OxideMerge should open its window and keep running until timeout stops it.
      - name: Start OxideMerge
        run: |
          Xvfb :99 -screen 0 1280x800x24 >xvfb.log 2>&1 &
          xvfb=$!
          sleep 3
          status=0
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 timeout 20 squashfs-root/AppRun || status=$?
          kill "$xvfb"
          if [ "$status" != 124 ]; then
            echo "::error::OxideMerge quit with status $status within 20 seconds"
            exit 1
          fi
          echo "OxideMerge was still running after 20 seconds"

  macos:
    name: macOS universal
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ (github.event_name == 'push' || inputs.packages) && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build tests
        run: cargo test --release --locked --target aarch64-apple-darwin --no-run

      - name: Test
        timeout-minutes: 20
        run: cargo test --release --locked --target aarch64-apple-darwin

      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build Intel slice
        if: github.event_name == 'push' || inputs.packages
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Window smoke test
        env:
          GUI_SMOKE_STRICT: "1"
        run: bash scripts/gui-smoke.sh target/aarch64-apple-darwin/release/oxidemerge target/gui-smoke

      - name: Keep test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-output-macos
          path: |
            target/gui-tests
            target/gui-smoke
          if-no-files-found: ignore

      # With the five MACOS_* secrets set, the app and .dmg are signed with a Developer ID,
      # notarized and stapled (scripts/macos-sign.sh); with none of them, as on forks and pull
      # requests, the app is signed ad hoc. Secrets reach this step only.
      - name: Package
        if: github.event_name == 'push' || inputs.packages
        id: package
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            label=$version
          else
            label="$version-${GITHUB_SHA::7}"
          fi
          signing=$(bash scripts/macos-sign.sh mode)
          echo "Signing: $signing"
          bash scripts/macos-sign.sh setup
          name="oxidemerge-$label-macos-universal"
          app=staging/dmg/OxideMerge.app
          mkdir -p dist "$app/Contents/MacOS" "$app/Contents/Resources"

          # One binary for Apple silicon and Intel Macs.
          lipo -create -output "$app/Contents/MacOS/oxidemerge" \
            target/aarch64-apple-darwin/release/oxidemerge \
            target/x86_64-apple-darwin/release/oxidemerge
          strip -x "$app/Contents/MacOS/oxidemerge"
          lipo -info "$app/Contents/MacOS/oxidemerge"
          lipo "$app/Contents/MacOS/oxidemerge" -verify_arch arm64 x86_64 || {
            echo "::error::OxideMerge.app is not universal"
            exit 1
          }

          iconset=staging/oxidemerge.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256; do
            sips -z "$size" "$size" assets/oxidemerge.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
          done
          for size in 16 32 128; do
            double=$((size * 2))
            sips -z "$double" "$double" assets/oxidemerge.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/oxidemerge.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>OxideMerge</string>
            <key>CFBundleDisplayName</key><string>OxideMerge</string>
            <key>CFBundleIdentifier</key><string>io.github.kuopinghsu.oxidemerge</string>
            <key>CFBundleExecutable</key><string>oxidemerge</string>
            <key>CFBundleIconFile</key><string>oxidemerge</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>$MACOSX_DEPLOYMENT_TARGET</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSHumanReadableCopyright</key><string>MIT License</string>
            <key>NSDesktopFolderUsageDescription</key><string>OxideMerge compares the files and folders you open.</string>
            <key>NSDocumentsFolderUsageDescription</key><string>OxideMerge compares the files and folders you open.</string>
            <key>NSDownloadsFolderUsageDescription</key><string>OxideMerge compares the files and folders you open.</string>
            <key>NSRemovableVolumesUsageDescription</key><string>OxideMerge compares the files and folders you open.</string>
            <key>NSNetworkVolumesUsageDescription</key><string>OxideMerge compares the files and folders you open.</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          cp README.md LICENSE staging/dmg/

          # A Developer ID signature with the hardened runtime, or else an ad hoc one: Apple
          # silicon refuses to run unsigned code. An ad hoc app is not notarized (see
          # docs/macos-signing.md), so its first launch needs Open Anyway.
          bash scripts/macos-sign.sh app "$app"

          # The packaged binary must still work from the command line.
          bin="$app/Contents/MacOS/oxidemerge"
          "$bin" --version
          "$bin" --cli samples/left/same.txt samples/right/same.txt
          code=0
          "$bin" --cli -r samples/left samples/right >/dev/null || code=$?
          test "$code" -eq 1 || { echo "::error::Expected exit code 1 for differing folders, got $code"; exit 1; }
          # The Intel half too, through Rosetta.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$bin" --version
            arch -x86_64 "$bin" --cli samples/left/same.txt samples/right/same.txt
          else
            echo "::warning::Rosetta is not installed; the x86_64 slice was not run"
          fi

          ln -s /Applications staging/dmg/Applications
          # hdiutil now and then fails with "Resource busy" on hosted runners.
          for attempt in 1 2 3; do
            hdiutil create -volname OxideMerge -srcfolder staging/dmg -fs HFS+ -format UDZO -ov "dist/$name.dmg" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          # Signed, notarized, stapled and checked by Gatekeeper; or, ad hoc, only verified.
          bash scripts/macos-sign.sh dmg "dist/$name.dmg"
          # Installed as a download would be, judged by Gatekeeper, run and removed again.
          # Gatekeeper is turned on first if the runner has it off; the job fails if it can't be.
          INSTALL_CHECK_GATEKEEPER=require bash scripts/macos-install-check.sh "dist/$name.dmg" "$signing"

          ls -l dist
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Remove the signing keychain
        if: always() && (github.event_name == 'push' || inputs.packages)
        run: bash scripts/macos-sign.sh cleanup

      - if: github.event_name == 'push' || inputs.packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  # deny.toml lists the licenses allowed and the advisories reviewed. New advisories appear
  # without any change here, so outside of release tags they warn instead of failing.
  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

      - name: Advisories
        if: ${{ !cancelled() }}
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # A long run of the randomized diff, merge and patch tests, started by hand. It
  # is not needed for a release. A failure prints the seed that replays it:
  # OXIDEMERGE_TEST_SEED=<seed> cargo test regress
  stress:
    name: Randomized tests
    if: github.event_name == 'workflow_dispatch' && inputs.stress_cases != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check the number of cases
        env:
          CASES: ${{ inputs.stress_cases }}
        run: |
          [[ "$CASES" =~ ^[0-9]+$ ]] || { echo "::error::stress_cases must be a number"; exit 1; }
          echo "::notice::$CASES cases per test"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        env:
          OXIDEMERGE_TEST_CASES: ${{ inputs.stress_cases }}
        run: cargo test --release --locked --bin oxidemerge regress

  # Started by hand; the numbers are kept, not checked (see docs/benchmarks.md).
  benchmarks:
    name: Benchmarks
    if: github.event_name == 'workflow_dispatch' && inputs.benchmarks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libgl1-mesa-dev time

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run
        shell: bash
        env:
          OXIDEMERGE_BENCH_LARGE: "1"
        run: |
          cargo test --release --locked --bin oxidemerge bench -- --ignored --nocapture --test-threads 1
          cat target/bench/results.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmarks-${{ matrix.os }}
          path: target/bench/results.md

  user-guide:
    if: github.event_name == 'push' || inputs.packages
    name: User guide PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Asciidoctor PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby fontconfig fonts-dejavu-core python3-fonttools
          sudo gem install --no-document asciidoctor:2.0.26 asciidoctor-pdf:2.3.15

      # The Noto Sans fonts the script downloads, made again when it changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/guide-fonts
          key: guide-fonts-${{ hashFiles('scripts/build-user-guide.sh') }}

      - name: Build
        id: build
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            label=$version
          else
            label="$version-${GITHUB_SHA::7}"
          fi
          VERSION=$label bash scripts/build-user-guide.sh dist
          ls -l dist
          echo "name=oxidemerge-$label-user-guide" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/*.pdf
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [windows, linux, appimage, appimage-test, macos, user-guide, dependencies]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            CHANGELOG.md
            scripts/release-notes.sh
            scripts/check-release.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: oxidemerge-*
          path: dist
          merge-multiple: true

      # A published release is never replaced: a problem is fixed in the next patch version.
      - name: Check the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only "not found" lets the release go ahead; any other answer stops it.
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>&1); then
            echo "::error::Release $GITHUB_REF_NAME exists already; release a new patch version instead"
            exit 1
          elif ! grep -q 'HTTP 404' <<<"$out"; then
            echo "::error::Could not check for an existing release: $out"
            exit 1
          fi
          # Exactly these files are published, nothing missing and nothing else.
          v=${GITHUB_REF_NAME#v}
          expected=$(for f in \
            "linux-arm64.AppImage" "linux-arm64.tar.gz" \
            "linux-x64.AppImage" "linux-x64.tar.gz" \
            "macos-universal.dmg" \
            "user-guide.pdf" "user-guide.zh-TW.pdf" \
            "windows-arm64.zip" "windows-x64.zip"; do
            echo "oxidemerge-$v-$f"
          done | sort)
          ls -l dist
          ok=1
          for f in $expected; do
            [ -s "dist/$f" ] || { echo "::error::dist/$f is missing"; ok=0; }
          done
          for f in $(ls dist | sort); do
            grep -qx "$f" <<<"$expected" || { echo "::error::dist/$f is not a release file"; ok=0; }
          done
          [ "$ok" = 1 ]

      # Each package is checked as what it claims to be, after its trip through the
      # artifact store, then its digest is listed in SHA256SUMS.
      - name: Check package integrity
        run: bash scripts/check-release.sh dist

      # The release notes are this version's section of CHANGELOG.md, followed
      # by the download instructions.
      - name: Release notes
        run: |
          set -euo pipefail
          {
            bash scripts/release-notes.sh "$GITHUB_REF_NAME"
            echo
            echo "## Downloads"
            echo
            cat <<'EOF'
          **Windows (x64 or Arm64):** download `oxidemerge-*-windows-x64.zip` (Intel and AMD PCs) or `oxidemerge-*-windows-arm64.zip` (Arm PCs such as Snapdragon laptops), unzip it, and run `oxidemerge.exe`; there is nothing to install. Run `oxidemerge --register-shell` once to add the Explorer context menu.

          **Linux (x64 or Arm64):** pick the `linux-x64` packages for Intel and AMD machines and the `linux-arm64` ones for 64-bit Arm (aarch64). `oxidemerge-*-linux-<arch>.AppImage` runs without installing anything on Ubuntu 20.04, RHEL 8, Debian 10, and newer: `chmod +x` it, then run it. It carries the libraries OxideMerge needs besides glibc and the graphics driver. Without FUSE, start it with `--appimage-extract-and-run`. `oxidemerge-*-linux-<arch>.tar.gz` holds the bare program instead, with a desktop file and icon. File dialogs use the XDG desktop portal (`xdg-desktop-portal`).

          **macOS 11 or later (Apple silicon and Intel):** open `oxidemerge-*-macos-universal.dmg` and drag OxideMerge to Applications. The app is not notarized, so macOS blocks it the first time: try to open it once, then choose **Open Anyway** in **System Settings → Privacy & Security** (up to macOS 14, Control-clicking it and choosing **Open** also works), or run `xattr -dr com.apple.quarantine /Applications/OxideMerge.app`. To use it from the terminal, run `sudo ln -s /Applications/OxideMerge.app/Contents/MacOS/oxidemerge /usr/local/bin/oxidemerge`.

          **User guide:** `oxidemerge-*-user-guide.pdf` in English and `oxidemerge-*-user-guide.zh-TW.pdf` in Traditional Chinese.

          GitHub lists each download's SHA-256 digest on this page for checking it, and `SHA256SUMS` lists them all: `sha256sum -c --ignore-missing SHA256SUMS` (Linux) or `shasum -a 256 -c --ignore-missing SHA256SUMS` (macOS) checks the files you downloaded.
          EOF
            echo
            echo "Built from commit \`$GITHUB_SHA\` by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          body_path: release-notes.md
          overwrite_files: false
          prerelease: ${{ contains(github.ref_name, '-') }}
