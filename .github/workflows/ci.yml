# Builds, lints, and tests OxideMerge on Windows, Linux, and macOS for every
# push and pull request, then packages it: oxidemerge.exe plus a .zip for
# Windows x64 and arm64, a .tar.gz, a .deb, and an AppImage for Linux x64 and
# arm64, and a universal (Apple silicon and Intel) OxideMerge.app in a .dmg and
# a .zip for macOS. Arm64 packages are built and tested on Arm runners. The
# AppImages are started on Ubuntu and RHEL-compatible systems before they are
# published. Pushing a tag like `v0.9.2`
# also publishes every package on a GitHub release, with the version's section
# of CHANGELOG.md as the release notes. The tag must match the version in
# Cargo.toml, and CHANGELOG.md must have a section for it.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ring compiles its assembly with clang for Windows on Arm.
      - name: Install LLVM
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            $llvm = 'C:\Program Files\LLVM\bin'
            if (-not (Test-Path "$llvm\clang.exe")) {
              choco install llvm --no-progress -y
            }
            $llvm >> $env:GITHUB_PATH
          }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      # The code is the same on both architectures, so lint once.
      - name: Clippy
        if: matrix.arch == 'x64'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --release --locked --target ${{ matrix.target }}

      # An explicit target, so the package is for this architecture even if the
      # toolchain on the runner is not.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Command line smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin=target/$TARGET/release/oxidemerge
          "$bin" --version
          "$bin" --list-languages
          "$bin" --cli samples/left/same.txt samples/right/same.txt
          code=0
          "$bin" --cli -r samples/left samples/right >/dev/null || code=$?
          test "$code" -eq 1 || { echo "::error::Expected exit code 1 for differing folders, got $code"; exit 1; }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              Write-Error "Tag $env:GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            }
            $label = $version
          } else {
            $label = "$version-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          $name = "oxidemerge-$label-windows-$env:ARCH"
          $exe = "target/$env:TARGET/release/oxidemerge.exe"

          # The machine field of the PE header: 0x8664 for x64, 0xAA64 for arm64.
          $bytes = [IO.File]::ReadAllBytes($exe)
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4)
          $expected = @{ x64 = 0x8664; arm64 = 0xAA64 }[$env:ARCH]
          if ($machine -ne $expected) {
            Write-Error ("oxidemerge.exe is for machine 0x{0:X4}, not {1}" -f $machine, $env:ARCH)
            exit 1
          }

          New-Item -ItemType Directory -Force -Path dist, "staging/$name" | Out-Null
          Copy-Item $exe "dist/$name.exe"
          Copy-Item $exe, README.md, LICENSE "staging/$name/"
          Compress-Archive -Path "staging/$name" -DestinationPath "dist/$name.zip"

          Get-ChildItem dist | Format-Table Name, Length
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    # The oldest supported runners, so the binary runs on older glibc too.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            deb_arch: amd64
          - arch: arm64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
    env:
      ARCH: ${{ matrix.arch }}
      DEB_ARCH: ${{ matrix.deb_arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy
        if: matrix.arch == 'x64'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Command line smoke test
        run: |
          set -euo pipefail
          bin=target/release/oxidemerge
          "$bin" --version
          "$bin" --list-languages
          "$bin" --cli samples/left/same.txt samples/right/same.txt
          code=0
          "$bin" --cli -r samples/left samples/right >/dev/null || code=$?
          test "$code" -eq 1 || { echo "::error::Expected exit code 1 for differing folders, got $code"; exit 1; }

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            # The release notes come from CHANGELOG.md; fail before packaging, not after.
            scripts/release-notes.sh "$version" >/dev/null || {
              echo "::error::CHANGELOG.md has no section for $version"
              exit 1
            }
            label=$version
          else
            label="$version-${GITHUB_SHA::7}"
          fi
          name="oxidemerge-$label-linux-$ARCH"
          strip target/release/oxidemerge
          want=$([ "$ARCH" = arm64 ] && echo aarch64 || echo x86-64)
          file target/release/oxidemerge | tee /dev/stderr | grep -q "$want" || {
            echo "::error::oxidemerge is not a $want program"
            exit 1
          }
          mkdir -p dist "staging/$name"

          install -m 755 target/release/oxidemerge "staging/$name/"
          install -m 644 README.md LICENSE assets/oxidemerge.desktop assets/oxidemerge.png "staging/$name/"
          tar -C staging -czf "dist/$name.tar.gz" "$name"

          # Debian versions can't contain "-" without a revision; "~" also
          # sorts a build or pre-release before the release it leads to.
          deb_version=$(echo "$label" | tr '-' '~')
          root=staging/deb
          install -Dm 755 target/release/oxidemerge "$root/usr/bin/oxidemerge"
          install -Dm 644 assets/oxidemerge.desktop "$root/usr/share/applications/oxidemerge.desktop"
          install -Dm 644 assets/oxidemerge.png "$root/usr/share/icons/hicolor/256x256/apps/oxidemerge.png"
          install -Dm 644 LICENSE "$root/usr/share/doc/oxidemerge/copyright"
          install -Dm 644 README.md "$root/usr/share/doc/oxidemerge/README.md"
          mkdir -p "$root/DEBIAN"
          cat > "$root/DEBIAN/control" <<EOF
          Package: oxidemerge
          Version: $deb_version
          Architecture: $DEB_ARCH
          Maintainer: ${GITHUB_REPOSITORY_OWNER} <${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com>
          Installed-Size: $(du -sk "$root/usr" | cut -f1)
          Depends: libc6 (>= 2.35), libgl1, libegl1, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6
          Recommends: xdg-desktop-portal, xdg-utils, fontconfig
          Suggests: chromium | google-chrome-stable | microsoft-edge-stable
          Section: devel
          Priority: optional
          Homepage: https://github.com/${GITHUB_REPOSITORY}
          Description: Cross-platform diff and merge tool in the style of WinMerge
           OxideMerge compares and merges folders, text files, binary files and
           images, resolves version-control conflict files, and compares web
           pages.
          EOF
          dpkg-deb --build --root-owner-group "$root" "dist/$name.deb"
          dpkg-deb --info "dist/$name.deb"

          ls -l dist
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  appimage:
    name: Linux AppImage ${{ matrix.arch }}
    # AlmaLinux 8 has glibc 2.28, so the AppImage runs on RHEL 8, Ubuntu 20.04,
    # Debian 10, and newer.
    runs-on: ${{ matrix.runner }}
    container: almalinux:8
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      # OxideMerge links only to glibc and opens its display and keyboard
      # libraries at runtime. They are installed without their -devel
      # packages, so the build does not record AlmaLinux's library folders and
      # OxideMerge looks them up by name, as AppRun arranges.
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc make pkgconf-pkg-config git curl tar gzip jq file desktop-file-utils \
            libX11 libX11-xcb libxcb libXcursor libXi libxkbcommon libxkbcommon-x11 \
            libwayland-client libwayland-cursor libwayland-egl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            label=$version
          else
            label="$version-${GITHUB_SHA::7}"
          fi
          VERSION=$label bash scripts/package-appimage.sh
          ls -l dist
          echo "artifact=oxidemerge-$label-linux-${{ matrix.arch }}-appimage" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/*
          if-no-files-found: error

  appimage-test:
    name: AppImage ${{ matrix.arch }} on ${{ matrix.system }}
    needs: appimage
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        system: [Ubuntu 22.04, Ubuntu 24.04, RHEL 8 (AlmaLinux 8), RHEL 9 (AlmaLinux 9)]
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - system: Ubuntu 22.04
            image: ubuntu:22.04
          - system: Ubuntu 24.04
            image: ubuntu:24.04
          - system: RHEL 8 (AlmaLinux 8)
            image: almalinux:8
          - system: RHEL 9 (AlmaLinux 9)
            image: almalinux:9
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: oxidemerge-*-linux-${{ matrix.arch }}-appimage
          merge-multiple: true

      - name: Unpack
        run: |
          chmod +x oxidemerge-*.AppImage
          ./oxidemerge-*.AppImage --appimage-extract >/dev/null
          ls squashfs-root/usr/lib/oxidemerge

      # The bare image has no display libraries, so AppRun would use every
      # bundled one: together with glibc they must cover everything
      # OxideMerge and each of them needs.
      - name: Check bundled libraries
        working-directory: squashfs-root
        run: |
          bundled=$(printf '%s:' "$PWD"/usr/lib/oxidemerge/*)
          failed=0
          for file in usr/bin/oxidemerge usr/lib/oxidemerge/*/*; do
            if LD_LIBRARY_PATH=${bundled%:} ldd "$file" 2>&1 | grep 'not found'; then
              echo "::error::$file needs the libraries above"
              failed=1
            fi
          done
          exit $failed

      - name: Command line smoke test
        run: |
          set -euo pipefail
          app=squashfs-root/AppRun
          "$app" --version
          mkdir -p left right
          printf 'one\ntwo\n' > left/a.txt
          printf 'one\ntwo\n' > right/a.txt
          "$app" --cli left/a.txt right/a.txt
          printf 'one\nthree\n' > right/a.txt
          code=0
          "$app" --cli left/a.txt right/a.txt >/dev/null || code=$?
          test "$code" -eq 1 || { echo "::error::Expected exit code 1 for differing files, got $code"; exit 1; }

      - name: Install a virtual display
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              xvfb libgl1 libglx-mesa0 libegl1 libegl-mesa0 libgl1-mesa-dri
          else
            dnf install -y --setopt=install_weak_deps=False \
              xorg-x11-server-Xvfb mesa-libGL mesa-libEGL mesa-dri-drivers
          fi

      # OxideMerge should open its window and keep running until timeout stops it.
      - name: Start OxideMerge
        run: |
          Xvfb :99 -screen 0 1280x800x24 >xvfb.log 2>&1 &
          xvfb=$!
          sleep 3
          status=0
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 timeout 20 squashfs-root/AppRun || status=$?
          kill "$xvfb"
          if [ "$status" != 124 ]; then
            echo "::error::OxideMerge quit with status $status within 20 seconds"
            exit 1
          fi
          echo "OxideMerge was still running after 20 seconds"

  macos:
    name: macOS universal
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            label=$version
          else
            label="$version-${GITHUB_SHA::7}"
          fi
          name="oxidemerge-$label-macos-universal"
          app=staging/dmg/OxideMerge.app
          mkdir -p dist "$app/Contents/MacOS" "$app/Contents/Resources"

          # One binary for Apple silicon and Intel Macs.
          lipo -create -output "$app/Contents/MacOS/oxidemerge" \
            target/aarch64-apple-darwin/release/oxidemerge \
            target/x86_64-apple-darwin/release/oxidemerge
          strip -x "$app/Contents/MacOS/oxidemerge"
          lipo -info "$app/Contents/MacOS/oxidemerge"

          iconset=staging/oxidemerge.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256; do
            sips -z "$size" "$size" assets/oxidemerge.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
          done
          for size in 16 32 128; do
            double=$((size * 2))
            sips -z "$double" "$double" assets/oxidemerge.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/oxidemerge.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>OxideMerge</string>
            <key>CFBundleDisplayName</key><string>OxideMerge</string>
            <key>CFBundleIdentifier</key><string>io.github.kuopinghsu.oxidemerge</string>
            <key>CFBundleExecutable</key><string>oxidemerge</string>
            <key>CFBundleIconFile</key><string>oxidemerge</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>$MACOSX_DEPLOYMENT_TARGET</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSHumanReadableCopyright</key><string>MIT License</string>
            <key>NSDesktopFolderUsageDescription</key><string>OxideMerge compares the files and folders you open.</string>
            <key>NSDocumentsFolderUsageDescription</key><string>OxideMerge compares the files and folders you open.</string>
            <key>NSDownloadsFolderUsageDescription</key><string>OxideMerge compares the files and folders you open.</string>
            <key>NSRemovableVolumesUsageDescription</key><string>OxideMerge compares the files and folders you open.</string>
            <key>NSNetworkVolumesUsageDescription</key><string>OxideMerge compares the files and folders you open.</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          cp README.md LICENSE staging/dmg/

          # Ad-hoc signature: Apple silicon refuses to run unsigned code. The
          # app is not notarized, so the first launch needs Open from the
          # context menu, or System Settings > Privacy & Security > Open Anyway.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

          # The packaged binary must still work from the command line.
          bin="$app/Contents/MacOS/oxidemerge"
          "$bin" --version
          "$bin" --cli samples/left/same.txt samples/right/same.txt
          code=0
          "$bin" --cli -r samples/left samples/right >/dev/null || code=$?
          test "$code" -eq 1 || { echo "::error::Expected exit code 1 for differing folders, got $code"; exit 1; }
          # The Intel half too, through Rosetta.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$bin" --version
            arch -x86_64 "$bin" --cli samples/left/same.txt samples/right/same.txt
          else
            echo "::warning::Rosetta is not installed; the x86_64 slice was not run"
          fi

          ditto -c -k --keepParent "$app" "dist/$name.zip"
          ln -s /Applications staging/dmg/Applications
          # hdiutil now and then fails with "Resource busy" on hosted runners.
          for attempt in 1 2 3; do
            hdiutil create -volname OxideMerge -srcfolder staging/dmg -fs HFS+ -format UDZO -ov "dist/$name.dmg" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done

          ls -l dist
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [windows, linux, appimage, appimage-test, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            CHANGELOG.md
            scripts/release-notes.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: oxidemerge-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The release notes are this version's section of CHANGELOG.md, followed
      # by the download instructions.
      - name: Release notes
        run: |
          set -euo pipefail
          {
            bash scripts/release-notes.sh "$GITHUB_REF_NAME"
            echo
            echo "## Downloads"
            echo
            cat <<'EOF'
          **Windows (x64 or Arm64):** download `oxidemerge-*-windows-x64.exe` (Intel and AMD PCs) or `oxidemerge-*-windows-arm64.exe` (Arm PCs such as Snapdragon laptops) and run it, or unzip the `.zip` of the same name. Run `oxidemerge --register-shell` once to add the Explorer context menu.

          **Linux (x64 or Arm64):** pick the `linux-x64` packages for Intel and AMD machines and the `linux-arm64` ones for 64-bit Arm (aarch64). `oxidemerge-*-linux-<arch>.AppImage` runs without installing anything on Ubuntu 20.04, RHEL 8, Debian 10, and newer: `chmod +x` it, then run it. It carries the libraries OxideMerge needs besides glibc and the graphics driver. Without FUSE, start it with `--appimage-extract-and-run`. On Ubuntu 22.04 or newer, `sudo apt install ./oxidemerge-*-linux-<arch>.deb` installs OxideMerge instead, and `oxidemerge-*-linux-<arch>.tar.gz` holds the bare program. File dialogs use the XDG desktop portal (`xdg-desktop-portal`).

          **macOS 11 or later (Apple silicon and Intel):** open `oxidemerge-*-macos-universal.dmg` and drag OxideMerge to Applications. The app is not notarized, so the first time, Control-click it and choose **Open**, or allow it in **System Settings → Privacy & Security**. `oxidemerge-*-macos-universal.zip` holds the same app. To use it from the terminal, run `sudo ln -s /Applications/OxideMerge.app/Contents/MacOS/oxidemerge /usr/local/bin/oxidemerge`.

          Check downloads against `SHA256SUMS.txt`. Web page screenshots need a Chromium-based browser (Edge, Chrome, Chromium or Brave); every other compare works without one.
          EOF
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
