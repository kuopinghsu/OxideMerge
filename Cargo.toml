[package]
name = "oxidemerge"
version = "0.9.10"
edition = "2021"
description = "OxideMerge - a cross-platform differencing and merging tool for Windows, macOS and Linux"
license = "MIT"
repository = "https://github.com/kuopinghsu/OxideMerge"

[[bin]]
name = "oxidemerge"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "persistence", "x11", "wayland"] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "regex"] }
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.15"
similar = "2.6"
encoding_rs = "0.8"
chardetng = "0.1"
walkdir = "2"
same-file = "1"
regex = "1"
memchr = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "tga", "pnm"] }
# Every compression method and both kinds of encryption a zip can hold, read and written.
zip = { version = "9.4", default-features = false, features = ["deflate-flate2", "aes-crypto", "bzip2", "deflate64", "lzma", "ppmd", "xz", "zstd"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
bzip2 = "0.6"
# The LZMA2 coder `sevenz-rust2` already builds, used for reading and writing `.tar.xz`.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["util", "compress", "bzip2", "deflate", "ppmd", "aes256", "zstd", "brotli", "lz4"] }
# The UnRAR library, built from its C++ source, which reads RAR archives. It comes under its
# own license (the crate's `vendor/unrar/license.txt`): free to use and distribute, but not
# for writing RAR archives.
unrar_sys = "0.5.8"
# The Zstandard library `zip` and `sevenz-rust2` already build, used for `.tar.zst`.
zstd = "0.14"
zeroize = "1"
quick-xml = "0.42"
toml = { version = "1.1", default-features = false, features = ["std", "parse"] }
yaml-rust = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
sha2 = "0.10"
# Already built for egui; its `HashTable` lets line interning store 4-byte ids alone.
hashbrown = { version = "0.17", default-features = false }
aho-corasick = "1"
dirs = "5"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
anyhow = "1"
tempfile = "3"

trash = "5"
sys-locale = "0.3"
ttf-parser = "0.25"
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
ureq = "3"
url = "2.5.9"
unicode-segmentation = "1"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
arboard = "3"
ssh2 = { version = "0.9", features = ["vendored-openssl", "openssl-on-win32"] }
# The TLS stack and root certificates `ureq` already builds, used for FTPS.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# An xz coder of its own, so that tests check `.tar.xz` files against another one.
lzma-rs = "0.3"

[build-dependencies]
winresource = "0.1"

# `cargo build --release` (`make release`) is the everyday optimized build, quick to build.
# `panic = "abort"` must not be used in either profile: stopping a job unwinds out of it
# (`core::cancel`).
[profile.release]
strip = true

# Tuned for size, for the packages CI builds: `cargo build --profile release-size` (`make
# opt-size`), into `target/release-size/`. On Windows this takes the program from 55.3 MB to
# 44.2 MB, and the benchmarks in `src/core/bench.rs` run as fast as with `opt-level = 3` and
# thin LTO, within noise, except a 4K image compare (0.11 s to 0.14 s), but it builds much
# more slowly.
[profile.release-size]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
