# cargo-deny settings: `cargo deny check` looks for known vulnerabilities, licenses that the MIT
# licensed program can't be shipped with, and crates from outside crates.io.

[graph]
all-features = true

[advisories]
# Every advisory fails the check, also for unmaintained crates, until it is fixed or reviewed
# and listed here with the reason. So does a crate version its authors withdrew.
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "zip: archives are read entry by entry into regular files; ZipArchive::extract and Unix modes are not used" },
  { id = "RUSTSEC-2026-0368", reason = "zip: no symbolic links are created; link entries are extracted as small regular files" },
  { id = "RUSTSEC-2026-0369", reason = "zip: no permissions are applied to extracted files" },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.30 comes with zbus_xml (Linux accessibility), which reads D-Bus interface descriptions from the local session, not user files" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.30: as above; NsReader is not used on user files" },
  { id = "RUSTSEC-2025-0141", reason = "bincode (unmaintained) loads syntect's built-in syntax definitions only" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust (unmaintained) comes with syntect; no YAML syntax files are loaded" },
  { id = "RUSTSEC-2024-0436", reason = "paste (unmaintained) is a build-time macro of accesskit_windows" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser (unmaintained) reads the bundled fonts and installed system fonts; no successor is available to egui 0.31" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant (unmaintained as a standalone crate) comes with zbus, used by the file dialogs and accessibility on Linux" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: as above" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: as above" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  # bzip2 compression (libbz2-rs-sys).
  "bzip2-1.0.6",
  # Mozilla's root certificates (webpki-roots).
  "CDLA-Permissive-2.0",
  # File-level copyleft: changes to those files would have to be published. Used as is.
  "MPL-2.0",
  # The fonts egui ships with.
  "OFL-1.1",
  "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
